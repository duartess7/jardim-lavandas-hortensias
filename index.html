<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d20">
  <title>Jardim de lavandas e hortênsias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="garden" aria-label="Um jardim noturno animado de lavandas e hortênsias">
    <div class="aurora" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>
    <div class="fireflies" aria-hidden="true"></div>

    <section class="message" aria-live="polite">
      <p class="kicker">um pequeno jardim para você</p>
      <h1>Tudo vai dar certo.<br><span>Algumas coisas só precisam de tempo para florescer.</span></h1>
      <button class="replay" type="button"><span>Florescer novamente</span></button>
    </section>

    <div class="scene" aria-hidden="true">
      <div class="hydrangea hydrangea--left">
        <div class="hydrangea__stem"></div>
        <div class="leaf leaf--a"></div><div class="leaf leaf--b"></div>
        <div class="hydrangea__head"></div>
      </div>
      <div class="hydrangea hydrangea--right">
        <div class="hydrangea__stem"></div>
        <div class="leaf leaf--a"></div><div class="leaf leaf--b"></div>
        <div class="hydrangea__head"></div>
      </div>
      <div class="lavenders"></div>
    </div>

    <div class="ground" aria-hidden="true"></div>
    <div class="mist" aria-hidden="true"></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
